<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Merchant Onboarding</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h3 class="mb-4">Merchant Onboarding</h3>
    <form id="onboardForm">
      <div class="mb-3">
        <label for="name" class="form-label">Merchant Name</label>
        <input type="text" class="form-control" id="name" required />
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" class="form-control" id="email" required />
      </div>
      <div class="mb-3">
        <label for="pan" class="form-label">PAN Number</label>
        <input type="text" class="form-control" id="pan" required />
      </div>
      <div class="mb-3">
        <label for="gst" class="form-label">GST Number</label>
        <input type="text" class="form-control" id="gst" />
      </div>
      <button type="submit" class="btn btn-primary">Onboard Merchant</button>
    </form>
  </div>

  <script>
    document.getElementById('onboardForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const data = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        pan: document.getElementById('pan').value,
        gst: document.getElementById('gst').value,
      };
      console.log("Submitting:", data);
      alert("Merchant onboarded (demo mode). Call your API here.");
    });
  </script>
</body>
</html>
