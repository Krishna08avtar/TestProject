<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Start Rent</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h3 class="mb-4">Start Renting Services</h3>
    <form id="rentForm">
      <div class="mb-3">
        <label class="form-label">Merchant ID</label>
        <input type="text" class="form-control" id="merchantId" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Select Service</label>
        <select class="form-select" id="serviceType">
          <option value="POS Terminal">POS Terminal</option>
          <option value="UPI QR">UPI QR</option>
          <option value="Netbanking Gateway">Netbanking Gateway</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Quantity</label>
        <input type="number" class="form-control" id="quantity" value="1" required />
      </div>
      <button type="submit" class="btn btn-success">Start Rent</button>
    </form>
  </div>

  <script>
    document.getElementById('rentForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const rentData = {
        merchantId: document.getElementById('merchantId').value,
        serviceType: document.getElementById('serviceType').value,
        quantity: document.getElementById('quantity').value,
      };
      console.log("Rent Request:", rentData);
      alert("Service rented (demo mode). Integrate with backend.");
    });
  </script>
</body>
</html>
