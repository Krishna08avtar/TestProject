<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Billing History</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h3 class="mb-4">Merchant Billing History</h3>
    <table class="table table-bordered">
      <thead class="table-dark">
        <tr>
          <th>Date</th>
          <th>Service</th>
          <th>Qty</th>
          <th>Days</th>
          <th>Amount (₹)</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>2025-07-20</td>
          <td>POS Terminal</td>
          <td>2</td>
          <td>5</td>
          <td>1000</td>
          <td><span class="badge bg-success">Paid</span></td>
        </tr>
        <tr>
          <td>2025-07-28</td>
          <td>UPI QR</td>
          <td>1</td>
          <td>3</td>
          <td>150</td>
          <td><span class="badge bg-warning text-dark">Pending</span></td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
